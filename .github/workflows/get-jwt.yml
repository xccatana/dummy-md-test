name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check secrets
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: |
          [ -n "$VAULT_CI_ROLE_ID" ] || (echo "VAULT_CI_ROLE_ID is missing" && exit 1)
          [ -n "$VAULT_CI_SECRET_ID" ] || (echo "VAULT_CI_SECRET_ID is missing" && exit 1)
          echo "OK: both secrets are available"
