name: test-vault-jwt
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vault
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update && sudo apt-get install vault -y

      - name: Login to Vault using JWT
        env:
          VAULT_ADDR: https://vault-amer.adobe.net
          VAULT_NAMESPACE: dx_primetime_authentication
        run: |
          echo {{ secrets.dev.BRIGHTDATA_ACCOUNT_ID_DEV }}
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')

          vault write auth/jwt/login \
            role=vault-jwt-access \
            jwt="$TOKEN"
