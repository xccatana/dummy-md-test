name: get-jwt
on:
  workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  jwt:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token
        run: |
          echo "Requesting OIDC token..."

          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')

          echo "JWT:"
          echo "$TOKEN"
